<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account | LearnLoop AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">

  <div class="auth-wrapper">

    <div class="auth-brand">
      <span class="brand-icon">✦</span>
      <span class="brand-name">LearnLoop <span class="brand-accent">AI</span></span>
    </div>

    <div class="login-card">
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Start your personalized learning loop today.</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="form-alert" id="form-alert">
            {% for message in messages %}
              <p>{{ message }}</p>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form class="auth-form" id="register-form" method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
          <label for="full_name">Full name</label>
          <input type="text" id="full_name" name="full_name" placeholder="Your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a password" required>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm password</label>
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
        </div>

        <label class="checkbox-label">
          <input type="checkbox" id="agree-terms" name="agree_terms" required>
          <span>I agree to the Terms of Service and Privacy Policy</span>
        </label>

        <button type="submit" class="btn btn-primary btn-block" id="register-btn">Create account</button>
      </form>

      <p class="auth-footer">
        Already have an account?
        <a href="{{ url_for('login') }}" id="go-to-login-link">Log in</a>
      </p>
    </div>

  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
