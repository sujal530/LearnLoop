<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | LearnLoop AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">

  <div class="auth-wrapper">

    <div class="auth-brand">
      <span class="brand-icon">✦</span>
      <span class="brand-name">LearnLoop <span class="brand-accent">AI</span></span>
    </div>

    <div class="login-card">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Log in to continue your learning loop.</p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="form-alert" id="form-alert">
            {% for message in messages %}
              <p>{{ message }}</p>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form class="auth-form" id="login-form" method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me" name="remember_me">
            <span>Remember me</span>
          </label>
          <a href="#" class="form-link" id="forgot-password-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log in</button>
      </form>

      <p class="auth-footer">
        Don't have an account?
        <a href="{{ url_for('register') }}" id="go-to-register-link">Create one</a>
      </p>
    </div>

  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
